[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Theme > Green
ContextAction=[!CommandMeasure MeasureTheme "SetTheme('Green')"]
ContextTitle2=Theme > Blue
ContextAction2=[!CommandMeasure MeasureTheme "SetTheme('Blue')"]
ContextTitle3=Theme > Red
ContextAction3=[!CommandMeasure MeasureTheme "SetTheme('Red')"]
ContextTitle4=Theme > Purple
ContextAction4=[!CommandMeasure MeasureTheme "SetTheme('Purple')"]
ContextTitle5=Theme > Next
ContextAction5=[!CommandMeasure MeasureTheme "NextTheme()"]
ContextTitle6=---
ContextTitle7=Edit settings
ContextAction7=["notepad.exe" "#@#Settings.inc"]
ContextTitle8=Refresh all
ContextAction8=[!RefreshApp]
ContextTitle9=Network settings
ContextAction9=["ms-settings:network-status"]

[Metadata]
Name=Hacker Suite Network
Author=Tawsif
Version=3.0
Information=Auto-detects the active adapter. Live graph, session totals, ping with status dot, local IP.

[Variables]
@Include=#@#Themes\Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Common.inc
FontFace=JetBrains Mono
PingColor=#Dim#

; ==================== MEASURES ====================
[MeasureDown]
Measure=NetIn
Interface=Best

[MeasureUp]
Measure=NetOut
Interface=Best

[MeasureDownTotal]
Measure=NetIn
Interface=Best
Cumulative=1
UpdateDivider=5

[MeasureUpTotal]
Measure=NetOut
Interface=Best
Cumulative=1
UpdateDivider=5

[MeasureAdapter]
Measure=SysInfo
SysInfoType=ADAPTER_DESCRIPTION
SysInfoData=Best
UpdateDivider=30

[MeasureIP]
Measure=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
UpdateDivider=30

[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#PingHost#
UpdateRate=10
Timeout=2000
TimeoutValue=0
RegExpSubstitute=1
Substitute="^0$":"--"
IfCondition=MeasurePing = 0
IfTrueAction=[!SetVariable PingColor "#Crit#"]
IfCondition2=(MeasurePing > 0) && (MeasurePing >= 150)
IfTrueAction2=[!SetVariable PingColor "#Warn#"]
IfCondition3=(MeasurePing > 0) && (MeasurePing < 150)
IfTrueAction3=[!SetVariable PingColor "#Accent#"]

; ==================== STYLES ====================
[StyleLabel]
X=20
FontFace=#FontFace#
FontSize=12
FontColor=#Dim#
AntiAlias=1

[StyleValue]
X=380
StringAlign=Right
FontFace=#FontFace#
FontSize=12
FontColor=#Accent#
AntiAlias=1
AutoScale=1
NumOfDecimals=1

[StyleTotal]
X=210
StringAlign=Center
FontFace=#FontFace#
FontSize=9
FontColor=#Faint#
AntiAlias=1
AutoScale=1
NumOfDecimals=1

; ==================== METERS ====================
[Background]
Meter=Shape
Shape=Rectangle 0,0,400,180,8 | Fill Color #BG# | StrokeWidth 1 | Stroke Color #Accent#

[Title]
Meter=String
MeterStyle=StyleLabel
Y=12
StringStyle=Bold
Text="NETWORK"
LeftMouseUpAction=["ms-settings:network-status"]
ToolTipText=Open network settings

[PingDot]
Meter=Shape
X=10R
Y=17
Shape=Ellipse 4,4,4 | Fill Color #PingColor# | StrokeWidth 0
DynamicVariables=1
ToolTipText=Internet status (ping #PingHost#)

[PingText]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasurePing
Y=13
FontSize=10
FontColor=#Dim#
NumOfDecimals=0
AutoScale=0
Text="PING %1 ms"
ToolTipText=Ping to #PingHost#

[AdapterText]
Meter=String
MeterStyle=StyleLabel
MeasureName=MeasureAdapter
Y=32
W=360
H=14
ClipString=1
FontSize=8
FontColor=#Faint#
Text="%1"

[GraphBG]
Meter=Shape
Shape=Rectangle 20,50,360,50,3 | Fill Color #BarBG# | StrokeWidth 0

[Graph]
Meter=Line
MeasureName=MeasureDown
MeasureName2=MeasureUp
X=20
Y=50
W=360
H=50
LineWidth=2
LineColor=#Accent#
LineColor2=#Secondary#
AutoScale=1
AntiAlias=1

[DownLabel]
Meter=String
MeterStyle=StyleLabel
Y=108
Text="DOWN"

[DownTotal]
Meter=String
MeterStyle=StyleTotal
MeasureName=MeasureDownTotal
Y=111
Text="total %1B"

[DownVal]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureDown
Y=108
Text="%1B/s"

[UpLabel]
Meter=String
MeterStyle=StyleLabel
Y=130
Text="UP"

[UpTotal]
Meter=String
MeterStyle=StyleTotal
MeasureName=MeasureUpTotal
Y=133
Text="total %1B"

[UpVal]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureUp
Y=130
FontColor=#Secondary#
Text="%1B/s"

[IPText]
Meter=String
MeterStyle=StyleLabel
MeasureName=MeasureIP
Y=154
FontSize=9
FontColor=#Dim#
Text="LOCAL IP  %1"
