[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Theme > Green
ContextAction=[!CommandMeasure MeasureTheme "SetTheme('Green')"]
ContextTitle2=Theme > Blue
ContextAction2=[!CommandMeasure MeasureTheme "SetTheme('Blue')"]
ContextTitle3=Theme > Red
ContextAction3=[!CommandMeasure MeasureTheme "SetTheme('Red')"]
ContextTitle4=Theme > Purple
ContextAction4=[!CommandMeasure MeasureTheme "SetTheme('Purple')"]
ContextTitle5=Theme > Next
ContextAction5=[!CommandMeasure MeasureTheme "NextTheme()"]
ContextTitle6=---
ContextTitle7=Edit settings
ContextAction7=["notepad.exe" "#@#Settings.inc"]
ContextTitle8=Refresh all
ContextAction8=[!RefreshApp]
ContextTitle9=Update weather now
ContextAction9=[!Refresh]

[Metadata]
Name=Hacker Suite Weather
Author=Tawsif
Version=3.0
Information=Live weather from Open-Meteo (free, no API key). City is detected automatically (WeatherAuto=1 in Settings.inc), otherwise Lat/Lon from Settings.inc. Refreshes every 30 min.

[Variables]
@Include=#@#Themes\Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Common.inc
FontFace=JetBrains Mono

; ==================== LOCATION ====================
[MeasureStart]
Measure=Calc
Formula=#WeatherAuto#
UpdateDivider=-1
IfCondition=MeasureStart = 1
IfTrueAction=[!EnableMeasure MeasureLocation][!UpdateMeasure MeasureLocation]
IfFalseAction=[!EnableMeasure MeasureWeatherData][!UpdateMeasure MeasureWeatherData]

[MeasureLocation]
Measure=WebParser
URL=http://ip-api.com/json/?fields=status,countryCode,city,lat,lon
RegExp=(?siU)"status":"success".*"countryCode":"(.*)".*"city":"(.*)".*"lat":([\d\.\-]+),.*"lon":([\d\.\-]+)\}
UpdateRate=21600
Disabled=1
FinishAction=[!UpdateMeasureGroup Loc][!EnableMeasure MeasureWeatherData][!UpdateMeasure MeasureWeatherData]
OnConnectErrorAction=[!EnableMeasure MeasureWeatherData][!UpdateMeasure MeasureWeatherData]
OnRegExpErrorAction=[!EnableMeasure MeasureWeatherData][!UpdateMeasure MeasureWeatherData]

[MeasureLocCity]
Measure=WebParser
URL=[MeasureLocation]
StringIndex=2
Group=Loc
RegExpSubstitute=1
Substitute="^$":"#LocationName#"

[MeasureLocLat]
Measure=WebParser
URL=[MeasureLocation]
StringIndex=3
Group=Loc
RegExpSubstitute=1
Substitute="^$":"#Lat#"

[MeasureLocLon]
Measure=WebParser
URL=[MeasureLocation]
StringIndex=4
Group=Loc
RegExpSubstitute=1
Substitute="^$":"#Lon#"

; ==================== WEATHER ====================
[MeasureWeatherData]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=[MeasureLocLat]&longitude=[MeasureLocLon]&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=2
RegExp=(?siU)"current":\{"time":"[^"]*T(\d\d:\d\d)".*"temperature_2m":([\d\.\-]+),.*"relative_humidity_2m":(\d+),.*"apparent_temperature":([\d\.\-]+),.*"wind_speed_10m":([\d\.\-]+),.*"weather_code":(\d+)\}.*"temperature_2m_max":\[([\d\.\-]+),([\d\.\-]+)\].*"temperature_2m_min":\[([\d\.\-]+),([\d\.\-]+)\].*"weather_code":\[(\d+),(\d+)\]
UpdateRate=1800
Disabled=1
DynamicVariables=1
FinishAction=[!SetOption StatusText Text "updated %1"][!UpdateMeasureGroup Wx][!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!SetOption StatusText Text "offline - will retry"][!UpdateMeter StatusText][!Redraw]
OnRegExpErrorAction=[!SetOption StatusText Text "bad response - will retry"][!UpdateMeter StatusText][!Redraw]

[MeasureTime]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=1
Group=Wx

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=2
Group=Wx
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureHumidity]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=3
Group=Wx
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureFeelsLike]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=4
Group=Wx
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureWind]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=5
Group=Wx
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureCode]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=6
Group=Wx
RegExpSubstitute=1
Substitute="^0$":"Clear sky","^[12]$":"Partly cloudy","^3$":"Overcast","^4[58]$":"Fog","^5[1-7]$":"Drizzle","^(6[1-7]|8[0-2])$":"Rain","^(7[1-7]|8[56])$":"Snow","^9[5-9]$":"Thunderstorm","^$":"loading..."

[MeasureMax0]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=7
Group=Wx
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureMax1]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=8
Group=Wx
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureMin0]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=9
Group=Wx
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureMin1]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=10
Group=Wx
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureCode1]
Measure=WebParser
URL=[MeasureWeatherData]
StringIndex=12
Group=Wx
RegExpSubstitute=1
Substitute="^0$":"Clear sky","^[12]$":"Partly cloudy","^3$":"Overcast","^4[58]$":"Fog","^5[1-7]$":"Drizzle","^(6[1-7]|8[0-2])$":"Rain","^(7[1-7]|8[56])$":"Snow","^9[5-9]$":"Thunderstorm","^$":"--"

; ==================== STYLES ====================
[StyleLabel]
X=20
FontFace=#FontFace#
FontSize=11
FontColor=#Dim#
AntiAlias=1

[StyleValue]
X=280
StringAlign=Right
FontFace=#FontFace#
FontSize=11
FontColor=#Accent#
AntiAlias=1

; ==================== METERS ====================
[Background]
Meter=Shape
Shape=Rectangle 0,0,300,212,8 | Fill Color #BG# | StrokeWidth 1 | Stroke Color #Accent#

[Title]
Meter=String
MeterStyle=StyleLabel
Y=12
FontSize=12
StringStyle=Bold
Text="WEATHER"

[LocationVal]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureLocCity
Y=13
W=170
ClipString=1
FontSize=10
FontColor=#Dim#
Text="%1"
DynamicVariables=1
ToolTipText=Open full forecast
LeftMouseUpAction=["https://www.google.com/search?q=weather+[MeasureLocCity]"]

[TempText]
Meter=String
MeasureName=MeasureTemp
X=20
Y=34
FontFace=#FontFace#
FontSize=28
FontColor=#Accent#
StringStyle=Bold
AntiAlias=1
Text="%1[\x00B0]C"

[CondText]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCode
Y=42
FontColor=#TextLight#
StringStyle=Bold
Text="%1"

[HiLoText]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureMax0
MeasureName2=MeasureMin0
Y=64
FontSize=10
FontColor=#Dim#
Text="H %1[\x00B0]  L %2[\x00B0]"

[FeelsLabel]
Meter=String
MeterStyle=StyleLabel
Y=94
Text="Feels like"

[FeelsVal]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureFeelsLike
Y=94
Text="%1[\x00B0]C"

[HumidityLabel]
Meter=String
MeterStyle=StyleLabel
Y=116
Text="Humidity"

[HumidityVal]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureHumidity
Y=116
Text="%1%"

[WindLabel]
Meter=String
MeterStyle=StyleLabel
Y=138
Text="Wind"

[WindVal]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureWind
Y=138
Text="%1 km/h"

[TomorrowLabel]
Meter=String
MeterStyle=StyleLabel
Y=160
Text="Tomorrow"

[TomorrowVal]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCode1
MeasureName2=MeasureMax1
MeasureName3=MeasureMin1
Y=160
Text="%1  %2[\x00B0]/%3[\x00B0]"

[StatusText]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureTime
Y=188
FontSize=8
FontColor=#Faint#
Text="connecting..."
