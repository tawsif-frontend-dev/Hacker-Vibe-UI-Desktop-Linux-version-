[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Theme > Green
ContextAction=[!CommandMeasure MeasureTheme "SetTheme('Green')"]
ContextTitle2=Theme > Blue
ContextAction2=[!CommandMeasure MeasureTheme "SetTheme('Blue')"]
ContextTitle3=Theme > Red
ContextAction3=[!CommandMeasure MeasureTheme "SetTheme('Red')"]
ContextTitle4=Theme > Purple
ContextAction4=[!CommandMeasure MeasureTheme "SetTheme('Purple')"]
ContextTitle5=Theme > Next
ContextAction5=[!CommandMeasure MeasureTheme "NextTheme()"]
ContextTitle6=---
ContextTitle7=Edit settings
ContextAction7=["notepad.exe" "#@#Settings.inc"]
ContextTitle8=Refresh all
ContextAction8=[!RefreshApp]
ContextTitle9=Next quote
ContextAction9=[!CommandMeasure MeasureQuote "Next()"]
ContextTitle10=Edit quotes list
ContextAction10=["notepad.exe" "#@#Quotes.txt"]

[Metadata]
Name=Hacker Suite Quote
Author=Tawsif
Version=3.0
Information=Random quote from @Resources\Quotes.txt every QuoteMinutes. Click for a new one.

[Variables]
@Include=#@#Themes\Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Common.inc
FontFace=JetBrains Mono
QuoteText=The only way to do great work is to love what you do.
QuoteAuthor=#UserName#

[MeasureQuote]
Measure=Script
ScriptFile=#@#Scripts\Quote.lua

[Background]
Meter=Shape
Shape=Rectangle 0,0,300,([QuoteBody:H] + 86),8 | Fill Color #BG# | StrokeWidth 1 | Stroke Color #Accent#
DynamicVariables=1

[QuoteMark]
Meter=String
X=15
Y=8
FontFace=#FontFace#
FontSize=24
FontColor=#Accent#
StringStyle=Bold
AntiAlias=1
Text=[\x201C]

[QuoteBody]
Meter=String
X=150
Y=42
W=260
StringAlign=Center
ClipString=2
FontFace=#FontFace#
FontSize=12
FontColor=#TextLight#
AntiAlias=1
DynamicVariables=1
Text=#QuoteText#
ToolTipText=Click for another quote
LeftMouseUpAction=[!CommandMeasure MeasureQuote "Next()"]

[QuoteAuthorText]
Meter=String
X=280
Y=12R
StringAlign=Right
FontFace=#FontFace#
FontSize=12
FontColor=#Accent#
StringStyle=Bold
AntiAlias=1
DynamicVariables=1
Text="- #QuoteAuthor#"
