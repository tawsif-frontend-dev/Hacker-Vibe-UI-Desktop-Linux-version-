[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Theme > Green
ContextAction=[!CommandMeasure MeasureTheme "SetTheme('Green')"]
ContextTitle2=Theme > Blue
ContextAction2=[!CommandMeasure MeasureTheme "SetTheme('Blue')"]
ContextTitle3=Theme > Red
ContextAction3=[!CommandMeasure MeasureTheme "SetTheme('Red')"]
ContextTitle4=Theme > Purple
ContextAction4=[!CommandMeasure MeasureTheme "SetTheme('Purple')"]
ContextTitle5=Theme > Next
ContextAction5=[!CommandMeasure MeasureTheme "NextTheme()"]
ContextTitle6=---
ContextTitle7=Edit settings
ContextAction7=["notepad.exe" "#@#Settings.inc"]
ContextTitle8=Refresh all
ContextAction8=[!RefreshApp]

[Metadata]
Name=Hacker Suite Theme Cycler
Author=Tawsif
Version=3.0
Information=Switches Green > Blue > Red > Purple every ThemeCycleMinutes (Settings.inc). Click to switch now. Unload this skin to keep one theme.

[Variables]
@Include=#@#Themes\Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Common.inc
FontFace=JetBrains Mono

[MeasureTick]
Measure=Calc
Formula=MeasureTick + 1
IfCondition=MeasureTick >= (#ThemeCycleMinutes# * 60)
IfTrueAction=[!CommandMeasure MeasureTheme "NextTheme()"]

[MeasureLeft]
Measure=Calc
Formula=Max(Ceil((#ThemeCycleMinutes# * 60 - MeasureTick) / 60), 0)

[StatusText]
Meter=String
MeasureName=MeasureLeft
X=0
Y=0
FontFace=#FontFace#
FontSize=10
FontColor=#Dim#
SolidColor=0,0,0,1
AntiAlias=1
Text="THEME: #ThemeName#  //  NEXT IN %1 MIN"
ToolTipText=Click: switch theme now
LeftMouseUpAction=[!CommandMeasure MeasureTheme "NextTheme()"]
MouseOverAction=[!SetOption StatusText FontColor "#Accent#"][!UpdateMeter StatusText][!Redraw]
MouseLeaveAction=[!SetOption StatusText FontColor "#Dim#"][!UpdateMeter StatusText][!Redraw]
