[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
ContextTitle=Theme > Green
ContextAction=[!CommandMeasure MeasureTheme "SetTheme('Green')"]
ContextTitle2=Theme > Blue
ContextAction2=[!CommandMeasure MeasureTheme "SetTheme('Blue')"]
ContextTitle3=Theme > Red
ContextAction3=[!CommandMeasure MeasureTheme "SetTheme('Red')"]
ContextTitle4=Theme > Purple
ContextAction4=[!CommandMeasure MeasureTheme "SetTheme('Purple')"]
ContextTitle5=Theme > Next
ContextAction5=[!CommandMeasure MeasureTheme "NextTheme()"]
ContextTitle6=---
ContextTitle7=Edit settings
ContextAction7=["notepad.exe" "#@#Settings.inc"]
ContextTitle8=Refresh all
ContextAction8=[!RefreshApp]

[Metadata]
Name=Hacker Suite Shortcuts
Author=Tawsif
Version=3.0
Information=Paths, label and URLs come from @Resources\Settings.inc

[Variables]
@Include=#@#Themes\Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Common.inc
FontFace=JetBrains Mono

[StyleLink]
X=20
FontFace=#FontFace#
FontSize=17
FontColor=#Accent#
AntiAlias=1
SolidColor=0,0,0,1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#Hover#"][!SetOption #CURRENTSECTION# StringStyle "Bold"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#Accent#"][!SetOption #CURRENTSECTION# StringStyle "Normal"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[Background]
Meter=Shape
Shape=Rectangle 1,1,300,391,90 | Fill Color #BG# | StrokeWidth 5 | Stroke Color #Accent#

[Title]
Meter=String
X=100
Y=10
FontFace=#FontFace#
FontSize=13
FontColor=#Dim#
StringStyle=Bold
AntiAlias=1
Text="SHORTCUTS"

[Shortcut1]
Meter=String
MeterStyle=StyleLink
Y=45
Text="> VS Code"
LeftMouseUpAction=["#VSCodePath#"]
ToolTipText=Launch VS Code

[Terminal]
Meter=String
MeterStyle=StyleLink
Y=80
Text="> Terminal"
LeftMouseUpAction=["cmd.exe" /k "cd /d %USERPROFILE%"]
ToolTipText=Open Terminal

[Shortcut2]
Meter=String
MeterStyle=StyleLink
Y=115
Text="> Facebook"
LeftMouseUpAction=["https://www.facebook.com"]
ToolTipText=Open Facebook in browser

[Shortcut3]
Meter=String
MeterStyle=StyleLink
Y=150
Text="> Messenger"
LeftMouseUpAction=["https://www.messenger.com"]
ToolTipText=Open Messenger in browser

[Shortcut4]
Meter=String
MeterStyle=StyleLink
Y=185
Text="> WhatsApp"
LeftMouseUpAction=["explorer.exe" shell:AppsFolder\5319275A.WhatsAppDesktop_cv1g1gvanyjgm!App]
ToolTipText=Launch WhatsApp

[Shortcut5]
Meter=String
MeterStyle=StyleLink
Y=220
Text="> YouTube"
LeftMouseUpAction=["https://www.youtube.com"]
ToolTipText=Open YouTube in browser

[Shortcut6]
Meter=String
MeterStyle=StyleLink
Y=255
Text="> Gmail"
LeftMouseUpAction=["https://mail.google.com"]
ToolTipText=Open Gmail in browser

[Portfolio]
Meter=String
MeterStyle=StyleLink
Y=290
Text="> #PortfolioLabel#"
LeftMouseUpAction=["#PortfolioURL#"]
ToolTipText=Open #PortfolioURL#

[Downloads]
Meter=String
MeterStyle=StyleLink
Y=325
Text="> Downloads"
LeftMouseUpAction=["#DownloadsPath#"]
ToolTipText=Open Downloads folder
