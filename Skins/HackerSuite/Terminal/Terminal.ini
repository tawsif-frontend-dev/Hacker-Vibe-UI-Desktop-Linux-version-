[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=1
ContextTitle=Theme > Green
ContextAction=[!CommandMeasure MeasureTheme "SetTheme('Green')"]
ContextTitle2=Theme > Blue
ContextAction2=[!CommandMeasure MeasureTheme "SetTheme('Blue')"]
ContextTitle3=Theme > Red
ContextAction3=[!CommandMeasure MeasureTheme "SetTheme('Red')"]
ContextTitle4=Theme > Purple
ContextAction4=[!CommandMeasure MeasureTheme "SetTheme('Purple')"]
ContextTitle5=Theme > Next
ContextAction5=[!CommandMeasure MeasureTheme "NextTheme()"]
ContextTitle6=---
ContextTitle7=Edit settings
ContextAction7=["notepad.exe" "#@#Settings.inc"]
ContextTitle8=Refresh all
ContextAction8=[!RefreshApp]
ContextTitle9=Open real terminal
ContextAction9=["cmd.exe" /k "cd /d %USERPROFILE%"]

[Metadata]
Name=Hacker Suite Terminal
Author=Tawsif
Version=3.0
Information=Neofetch-style system info read live from Windows (OS, CPU, GPU, RAM, uptime, screen, theme). Click to open a real terminal.

[Variables]
@Include=#@#Themes\Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Common.inc
FontFace=JetBrains Mono

; ==================== MEASURES ====================
[MeasureUser]
Measure=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1

[MeasureHost]
Measure=SysInfo
SysInfoType=COMPUTER_NAME
UpdateDivider=-1

[MeasureOS]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=ProductName
UpdateDivider=-1

[MeasureOSVer]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=DisplayVersion
UpdateDivider=-1

[MeasureCPUName]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString
RegExpSubstitute=1
Substitute="\((R|TM)\)":"","\bCPU\b":"","\s+":" ","^\s+|\s+$":""
UpdateDivider=-1

[MeasureGPU]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}\0000
RegValue=DriverDesc
RegExpSubstitute=1
Substitute="\((R|TM)\)":"","^$":"unknown"
UpdateDivider=-1

[MeasureRAMUsed]
Measure=PhysicalMemory
UpdateDivider=4

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[MeasureUptime]
Measure=Uptime
Format="%4!i!d %3!i!h %2!i!m"
UpdateDivider=20

[MeasureScreenW]
Measure=SysInfo
SysInfoType=SCREEN_WIDTH
UpdateDivider=20

[MeasureScreenH]
Measure=SysInfo
SysInfoType=SCREEN_HEIGHT
UpdateDivider=20

[MeasureBlink]
Measure=Calc
Formula=1 - MeasureBlink
IfCondition=MeasureBlink = 1
IfTrueAction=[!ShowMeter Cursor][!Redraw]
IfFalseAction=[!HideMeter Cursor][!Redraw]

; ==================== STYLES ====================
[StyleKey]
X=20
FontFace=#FontFace#
FontSize=10
FontColor=#Accent#
StringStyle=Bold
AntiAlias=1

[StyleVal]
X=100
W=285
H=18
ClipString=1
FontFace=#FontFace#
FontSize=10
FontColor=#TextLight#
AntiAlias=1

; ==================== METERS ====================
[Background]
Meter=Shape
Shape=Rectangle 0,0,400,300,8 | Fill Color #BG# | StrokeWidth 1 | Stroke Color #Accent#
LeftMouseUpAction=["cmd.exe" /k "cd /d %USERPROFILE%"]
ToolTipText=Click: open a real terminal

[TitleBar]
Meter=String
X=20
Y=12
FontFace=#FontFace#
FontSize=12
FontColor=#Dim#
StringStyle=Bold
AntiAlias=1
Text="TERMINAL"

[Dots]
Meter=Shape
Shape=Ellipse 350,21,5 | Fill Color #Crit# | StrokeWidth 0
Shape2=Ellipse 366,21,5 | Fill Color #Warn# | StrokeWidth 0
Shape3=Ellipse 382,21,5 | Fill Color #Accent# | StrokeWidth 0

[PromptTop]
Meter=String
MeasureName=MeasureUser
MeasureName2=MeasureHost
X=20
Y=42
FontFace=#FontFace#
FontSize=11
FontColor=#Accent#
AntiAlias=1
Text="%1@%2:~$ neofetch"

[KeyOS]
Meter=String
MeterStyle=StyleKey
Y=68
Text="OS"

[ValOS]
Meter=String
MeterStyle=StyleVal
MeasureName=MeasureOS
MeasureName2=MeasureOSVer
Y=68
Text="%1 %2"

[KeyCPU]
Meter=String
MeterStyle=StyleKey
Y=88
Text="CPU"

[ValCPU]
Meter=String
MeterStyle=StyleVal
MeasureName=MeasureCPUName
Y=88
Text="%1"

[KeyGPU]
Meter=String
MeterStyle=StyleKey
Y=108
Text="GPU"

[ValGPU]
Meter=String
MeterStyle=StyleVal
MeasureName=MeasureGPU
Y=108
Text="%1"

[KeyRAM]
Meter=String
MeterStyle=StyleKey
Y=128
Text="MEMORY"

[ValRAM]
Meter=String
MeterStyle=StyleVal
MeasureName=MeasureRAMUsed
MeasureName2=MeasureRAMTotal
Y=128
AutoScale=1
NumOfDecimals=1
Text="%1B / %2B"

[KeyUp]
Meter=String
MeterStyle=StyleKey
Y=148
Text="UPTIME"

[ValUp]
Meter=String
MeterStyle=StyleVal
MeasureName=MeasureUptime
Y=148
Text="%1"

[KeyRes]
Meter=String
MeterStyle=StyleKey
Y=168
Text="SCREEN"

[ValRes]
Meter=String
MeterStyle=StyleVal
MeasureName=MeasureScreenW
MeasureName2=MeasureScreenH
Y=168
Text="%1x%2"

[KeyTheme]
Meter=String
MeterStyle=StyleKey
Y=188
Text="THEME"

[ValTheme]
Meter=String
MeterStyle=StyleVal
Y=188
Text="#UserName# #ThemeName#"

[Palette]
Meter=Shape
X=20
Y=216
Shape=Rectangle 0,0,38,12,2 | Fill Color #Accent# | StrokeWidth 0
Shape2=Rectangle 45,0,38,12,2 | Fill Color #Hover# | StrokeWidth 0
Shape3=Rectangle 90,0,38,12,2 | Fill Color #Dim# | StrokeWidth 0
Shape4=Rectangle 135,0,38,12,2 | Fill Color #Faint# | StrokeWidth 0
Shape5=Rectangle 180,0,38,12,2 | Fill Color #Secondary# | StrokeWidth 0
Shape6=Rectangle 225,0,38,12,2 | Fill Color #Warn# | StrokeWidth 0
Shape7=Rectangle 270,0,38,12,2 | Fill Color #Crit# | StrokeWidth 0
Shape8=Rectangle 315,0,38,12,2 | Fill Color #TextLight# | StrokeWidth 0

[PromptBottom]
Meter=String
MeasureName=MeasureUser
MeasureName2=MeasureHost
X=20
Y=252
FontFace=#FontFace#
FontSize=11
FontColor=#Accent#
AntiAlias=1
Text="%1@%2:~$"

[Cursor]
Meter=Shape
X=4R
Y=r
Shape=Rectangle 0,3,9,15 | Fill Color #Accent# | StrokeWidth 0
