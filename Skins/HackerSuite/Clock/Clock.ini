[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Theme > Green
ContextAction=[!CommandMeasure MeasureTheme "SetTheme('Green')"]
ContextTitle2=Theme > Blue
ContextAction2=[!CommandMeasure MeasureTheme "SetTheme('Blue')"]
ContextTitle3=Theme > Red
ContextAction3=[!CommandMeasure MeasureTheme "SetTheme('Red')"]
ContextTitle4=Theme > Purple
ContextAction4=[!CommandMeasure MeasureTheme "SetTheme('Purple')"]
ContextTitle5=Theme > Next
ContextAction5=[!CommandMeasure MeasureTheme "NextTheme()"]
ContextTitle6=---
ContextTitle7=Edit settings
ContextAction7=["notepad.exe" "#@#Settings.inc"]
ContextTitle8=Refresh all
ContextAction8=[!RefreshApp]
ContextTitle9=12h / 24h
ContextAction9=[!WriteKeyValue Variables Clock24 (1-#Clock24#) "#@#Settings.inc"][!Refresh]

[Metadata]
Name=Hacker Suite Clock
Author=Tawsif
Version=3.0
Information=Click the time to switch 12h/24h. Bottom line rotates motto / greeting / year progress.

[Variables]
@Include=#@#Themes\Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Common.inc
FontFace=Orbitron
FontFaceMono=JetBrains Mono

; ---------- Measures ----------
[MeasureHM0]
Measure=Time
Format=%I:%M

[MeasureHM1]
Measure=Time
Format=%H:%M

[MeasureSec]
Measure=Time
Format=%S

[MeasureAMPM]
Measure=Time
Format=%p

[MeasureDate]
Measure=Time
Format=%A, %d %B %Y

[MeasureHour]
Measure=Time
Format=%H
RegExpSubstitute=1
Substitute="^(0[5-9]|1[01])$":"Good morning","^(1[2-6])$":"Good afternoon","^(1[7-9]|20)$":"Good evening","^(2[1-3]|0[0-4])$":"Good night"

[MeasureUser]
Measure=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1

[MeasureDOY]
Measure=Time
Format=%#j

[MeasureYear]
Measure=Time
Format=%Y

[MeasureWeek]
Measure=Time
Format=%V

[MeasureYearPct]
Measure=Calc
Formula=Floor([MeasureDOY] / (((([MeasureYear] % 4) = 0) && (([MeasureYear] % 100) <> 0)) || (([MeasureYear] % 400) = 0) ? 366 : 365) * 100)
DynamicVariables=1

[MeasureRotate]
Measure=Calc
Formula=(MeasureRotate + 1) % 30
IfCondition=MeasureRotate < 10
IfTrueAction=[!SetOption Motto Text "#Motto#"][!UpdateMeter Motto][!Redraw]
IfCondition2=(MeasureRotate >= 10) && (MeasureRotate < 20)
IfTrueAction2=[!SetOption Motto Text "%1, %2"][!UpdateMeter Motto][!Redraw]
IfCondition3=MeasureRotate >= 20
IfTrueAction3=[!SetOption Motto Text "YEAR %3% DONE  /  WEEK %4"][!UpdateMeter Motto][!Redraw]

; ---------- Meters ----------
[HMText]
Meter=String
MeasureName=MeasureHM#Clock24#
X=0
Y=0
FontFace=#FontFace#
FontSize=63
FontColor=#Accent#
StringStyle=Bold
AntiAlias=1
Text=%1
ToolTipText=Click: switch 12h / 24h
LeftMouseUpAction=[!WriteKeyValue Variables Clock24 (1-#Clock24#) "#@#Settings.inc"][!Refresh]

[AMPMText]
Meter=String
MeasureName=MeasureAMPM
X=310r
Y=6
FontFace=#FontFaceMono#
FontSize=18
FontColor=#Dim#
StringStyle=Bold
AntiAlias=1
Hidden=#Clock24#
Text=%1

[SecText]
Meter=String
MeasureName=MeasureSec
X=0r
Y=28
FontFace=#FontFaceMono#
FontSize=18
FontColor=#Dim#
AntiAlias=1
Text=":%1"

[DateText]
Meter=String
MeasureName=MeasureDate
X=0
Y=85
FontFace=#FontFaceMono#
FontSize=17
FontColor=#Accent#
StringStyle=Bold
AntiAlias=1
Text=%1

[Motto]
Meter=String
MeasureName=MeasureHour
MeasureName2=MeasureUser
MeasureName3=MeasureYearPct
MeasureName4=MeasureWeek
X=0
Y=118
FontFace=#FontFaceMono#
FontSize=12
FontColor=#Dim#
StringCase=Upper
AntiAlias=1
Text=#Motto#
