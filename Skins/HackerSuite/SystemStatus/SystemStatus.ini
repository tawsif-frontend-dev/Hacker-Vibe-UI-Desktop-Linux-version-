Y=36
FontSize=9
FontColor=#Dim#
Text="UP %1"

[Divider]
Meter=Shape
Shape=Line 20,58,380,58 | StrokeWidth 1 | Stroke Color #BarBG#

; --- CPU ---
[CPULabel]
Meter=String
MeterStyle=StyleLabel
Y=68
Text="CPU"
LeftMouseUpAction=["taskmgr"]

[CPUPct]
Meter=String
