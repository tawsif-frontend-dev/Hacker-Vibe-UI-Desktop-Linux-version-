[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Theme > Green
ContextAction=[!CommandMeasure MeasureTheme "SetTheme('Green')"]
ContextTitle2=Theme > Blue
ContextAction2=[!CommandMeasure MeasureTheme "SetTheme('Blue')"]
ContextTitle3=Theme > Red
ContextAction3=[!CommandMeasure MeasureTheme "SetTheme('Red')"]
ContextTitle4=Theme > Purple
ContextAction4=[!CommandMeasure MeasureTheme "SetTheme('Purple')"]
ContextTitle5=Theme > Next
ContextAction5=[!CommandMeasure MeasureTheme "NextTheme()"]
ContextTitle6=---
ContextTitle7=Edit settings
ContextAction7=["notepad.exe" "#@#Settings.inc"]
ContextTitle8=Refresh all
ContextAction8=[!RefreshApp]
ContextTitle9=---
ContextTitle10=Task Manager
ContextAction10=["taskmgr"]
ContextTitle11=Resource Monitor
ContextAction11=["resmon"]

[Metadata]
Name=Hacker Suite System Status
Author=Tawsif
Version=3.0
Information=CPU, RAM, Swap, Disks C/E/F, Network with live graphs and color alerts. Alert levels in Settings.inc.

[Variables]
@Include=#@#Themes\Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Common.inc
FontFace=JetBrains Mono
W=360
CPUColor=#Accent#
RAMColor=#Accent#
SwapColor=#Accent#
DiskColor=#Accent#
DiskEColor=#Accent#
DiskFColor=#Accent#

; ==================== MEASURES ====================

[MeasureUser]
Measure=SysInfo
SysInfoType=USER_NAME

[MeasureHost]
Measure=SysInfo
SysInfoType=COMPUTER_NAME

[MeasureIP]
Measure=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
UpdateDivider=60

[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeasureUptime]
Measure=Uptime
Format="%4!i!d %3!02i!h %2!02i!m"

[MeasureCPU]
Measure=CPU
Processor=0
IfCondition=MeasureCPU >= #CritAt#
IfTrueAction=[!SetVariable CPUColor "#Crit#"]
IfCondition2=(MeasureCPU >= #WarnAt#) && (MeasureCPU < #CritAt#)
IfTrueAction2=[!SetVariable CPUColor "#Warn#"]
IfCondition3=MeasureCPU < #WarnAt#
IfTrueAction3=[!SetVariable CPUColor "#Accent#"]

[MeasureTopCPU]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
Blacklist=_Total|Idle

[MeasureRAMUsed]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMPct]
Measure=Calc
Formula=MeasureRAMTotal > 0 ? (MeasureRAMUsed / MeasureRAMTotal * 100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureRAMPct >= #CritAt#
IfTrueAction=[!SetVariable RAMColor "#Crit#"]
IfCondition2=(MeasureRAMPct >= #WarnAt#) && (MeasureRAMPct < #CritAt#)
IfTrueAction2=[!SetVariable RAMColor "#Warn#"]
IfCondition3=MeasureRAMPct < #WarnAt#
IfTrueAction3=[!SetVariable RAMColor "#Accent#"]

[MeasureSwapUsed]
Measure=SwapMemory

[MeasureSwapTotal]
Measure=SwapMemory
Total=1

[MeasureSwapPct]
Measure=Calc
Formula=MeasureSwapTotal > 0 ? (MeasureSwapUsed / MeasureSwapTotal * 100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureSwapPct >= #CritAt#
IfTrueAction=[!SetVariable SwapColor "#Crit#"]
IfCondition2=(MeasureSwapPct >= #WarnAt#) && (MeasureSwapPct < #CritAt#)
IfTrueAction2=[!SetVariable SwapColor "#Warn#"]
IfCondition3=MeasureSwapPct < #WarnAt#
IfTrueAction3=[!SetVariable SwapColor "#Accent#"]

[MeasureDiskUsed]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=10

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=60

[MeasureDiskPct]
Measure=Calc
Formula=MeasureDiskTotal > 0 ? (MeasureDiskUsed / MeasureDiskTotal * 100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureDiskPct >= #CritAt#
IfTrueAction=[!SetVariable DiskColor "#Crit#"]
IfCondition2=(MeasureDiskPct >= #WarnAt#) && (MeasureDiskPct < #CritAt#)
IfTrueAction2=[!SetVariable DiskColor "#Warn#"]
IfCondition3=MeasureDiskPct < #WarnAt#
IfTrueAction3=[!SetVariable DiskColor "#Accent#"]

[MeasureDiskEUsed]
Measure=FreeDiskSpace
Drive=E:
InvertMeasure=1
UpdateDivider=10

[MeasureDiskETotal]
Measure=FreeDiskSpace
Drive=E:
Total=1
UpdateDivider=60
IfCondition=MeasureDiskETotal = 0
IfTrueAction=[!HideMeterGroup DiskE]
IfFalseAction=[!ShowMeterGroup DiskE]

[MeasureDiskEPct]
Measure=Calc
Formula=MeasureDiskETotal > 0 ? (MeasureDiskEUsed / MeasureDiskETotal * 100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureDiskEPct >= #CritAt#
IfTrueAction=[!SetVariable DiskEColor "#Crit#"]
IfCondition2=(MeasureDiskEPct >= #WarnAt#) && (MeasureDiskEPct < #CritAt#)
IfTrueAction2=[!SetVariable DiskEColor "#Warn#"]
IfCondition3=MeasureDiskEPct < #WarnAt#
IfTrueAction3=[!SetVariable DiskEColor "#Accent#"]

[MeasureDiskFUsed]
Measure=FreeDiskSpace
Drive=F:
InvertMeasure=1
UpdateDivider=10

[MeasureDiskFTotal]
Measure=FreeDiskSpace
Drive=F:
Total=1
UpdateDivider=60
IfCondition=MeasureDiskFTotal = 0
IfTrueAction=[!HideMeterGroup DiskF]
IfFalseAction=[!ShowMeterGroup DiskF]

[MeasureDiskFPct]
Measure=Calc
Formula=MeasureDiskFTotal > 0 ? (MeasureDiskFUsed / MeasureDiskFTotal * 100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureDiskFPct >= #CritAt#
IfTrueAction=[!SetVariable DiskFColor "#Crit#"]
IfCondition2=(MeasureDiskFPct >= #WarnAt#) && (MeasureDiskFPct < #CritAt#)
IfTrueAction2=[!SetVariable DiskFColor "#Warn#"]
IfCondition3=MeasureDiskFPct < #WarnAt#
IfTrueAction3=[!SetVariable DiskFColor "#Accent#"]

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

; ==================== STYLES ====================

[StyleLabel]
X=20
FontFace=#FontFace#
FontSize=10
FontColor=#Dim#
AntiAlias=1

[StyleValue]
X=380
StringAlign=Right
FontFace=#FontFace#
FontSize=10
FontColor=#Accent#
AntiAlias=1

; ==================== METERS ====================

[Background]
Meter=Shape
Shape=Rectangle 0.5,0.5,399,401,8 | Fill Color #BG# | StrokeWidth 1 | Stroke Color #Accent#

; --- Header ---
[Prompt]
Meter=String
MeterStyle=StyleLabel
MeasureName=MeasureUser
MeasureName2=MeasureHost
Y=12
FontSize=12
FontColor=#Accent#
StringStyle=Bold
Text="> %1@%2"

[Clock]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureTime
Y=12
FontSize=12
FontColor=#Dim#
Text="%1"

[IPText]
Meter=String
MeterStyle=StyleLabel
MeasureName=MeasureIP
Y=36
FontSize=9
Text="IP %1"

[UptimeText]
Meter=String
MeterStyle=StyleValue
