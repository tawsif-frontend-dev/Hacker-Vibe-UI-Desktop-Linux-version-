[CPUBar]
Meter=Shape
X=20
Y=90
Shape=Rectangle 0,0,#W#,6,3 | Fill Color #BarBG# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(#W# * [MeasureCPU:] / 100, 6)),6,3 | Fill Color #CPUColor# | StrokeWidth 0
DynamicVariables=1

[CPUGraph]
