# =====================================================================
#  HACKERVIBE for Linux - SETTINGS (the only file you ever need to edit)
#  Edit it with:   hackervibe settings
#  Apply changes:  hackervibe restart      (colours / quotes / clock apply by themselves)
#  Format: KEY="value"   (no shell expansion happens, so $ and ~ are taken literally)
# =====================================================================

# ---- Who are you? ---------------------------------------------------
# Used in greetings and as the author of your own quotes.
# (Wallpaper text is rendered by install.sh - run it again to change it.)
USER_NAME="Hacker"

# ---- Theme ----------------------------------------------------------
# Minutes between automatic theme changes (0 = never cycle)
THEME_CYCLE_MINUTES="30"
# 1 = also change the desktop wallpaper when the theme changes
THEME_WALLPAPER="1"

# ---- Clock ----------------------------------------------------------
# 1 = 24-hour, 0 = 12-hour   (toggle with: hackervibe clock24)
CLOCK24="1"
MOTTO="FOCUS / PLAN / EXECUTE / SUCCEED"

# ---- Calendar -------------------------------------------------------
# First day of the week: 0 = Sunday, 1 = Monday
WEEK_START="0"
# Countdown to a yearly event (rolls over to next year by itself)
EVENT_NAME="New Year"
EVENT_DAY="1"
EVENT_MONTH="1"

# ---- Quote ----------------------------------------------------------
# Minutes between random quotes (jump now with: hackervibe quote)
# Add your own quotes in ~/.config/hackervibe/quotes.txt  ("text|author", {USER} = your name)
QUOTE_MINUTES="60"

# ---- Weather (Open-Meteo, free, no API key) -------------------------
# 1 = detect your city from your IP address (sends a request to ip-api.com)
# 0 = always use LAT / LON / LOCATION_NAME below
WEATHER_AUTO="1"
LAT="51.5074"
LON="-0.1278"
LOCATION_NAME="London, UK"
# metric (C, km/h)  or  imperial (F, mph)
UNITS="metric"

# ---- System Status --------------------------------------------------
# Colour alerts (percent): accent -> warn -> crit
WARN_AT="60"
CRIT_AT="85"
# "auto" = up to 3 real disks, or list mount points:  DISKS="/ /home /mnt/data"
DISKS="auto"

# ---- Network --------------------------------------------------------
PING_HOST="1.1.1.1"
# "auto" = interface of your default route, or e.g. NET_IFACE="wlan0"
NET_IFACE="auto"

# ---- Shortcuts ------------------------------------------------------
# Up to 8 entries. Launch with:  hackervibe open 1   |   hackervibe open "code"   |   hackervibe launcher
PORTFOLIO_LABEL="GitHub"
PORTFOLIO_URL="https://github.com"
SHORTCUT1_LABEL="Code Editor"
SHORTCUT1_CMD="code"
SHORTCUT2_LABEL="Terminal"
SHORTCUT2_CMD="x-terminal-emulator"
SHORTCUT3_LABEL="Website"
SHORTCUT3_CMD="xdg-open https://github.com"
SHORTCUT4_LABEL="Browser"
SHORTCUT4_CMD="xdg-open https://duckduckgo.com"
SHORTCUT5_LABEL="Files"
SHORTCUT5_CMD="xdg-open $HOME"
SHORTCUT6_LABEL="Downloads"
SHORTCUT6_CMD="xdg-open $HOME/Downloads"

# ---- Display --------------------------------------------------------
# Widget size: "auto" = screen height / 768, or a number such as 1.0, 1.4, 2
UI_SCALE="auto"
# Which widgets to start (remove any you don't want)
WIDGETS="clock calendar weather system network terminal quote shortcuts themecycler"
# desktop (default) | normal | dock | override  - try "normal" if widgets don't show on your DE
WINDOW_TYPE="desktop"
# on = real transparency (needs a compositor, every modern DE has one)
# off = pseudo-transparency fallback for bare window managers
COMPOSITOR="on"
# Multi-monitor: 0 = default screen, or 1, 2 ... to pick a head
MONITOR="0"

# ---- Layout (optional) ----------------------------------------------
# Move a widget:  POS_<NAME>="alignment,x,y"   in design units of a 1366x768 screen
# alignment: top_left top_middle top_right middle_left middle_middle middle_right
#            bottom_left bottom_middle bottom_right
# Names: CLOCK CALENDAR WEATHER SYSTEM NETWORK TERMINAL QUOTE SHORTCUTS THEMECYCLER
# Example:  POS_CLOCK="top_middle,0,14"
