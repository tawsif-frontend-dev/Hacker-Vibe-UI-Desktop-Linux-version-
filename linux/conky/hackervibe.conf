-- HackerVibe for Linux :: shared conky config. The widget is chosen with HV_WIDGET=<name>.
-- Start everything with:  hackervibe start     (don't run this file by hand unless debugging)
local DATA = os.getenv('HV_DATA') or ((os.getenv('HOME') or '') .. '/.local/share/hackervibe')
package.path = DATA .. '/lib/?.lua;' .. package.path

local hv = require 'hv'
conky.config = hv.conky_config(os.getenv('HV_WIDGET') or 'clock')

-- everything is drawn with cairo from lib/widgets/<name>.lua
conky.text = [[ ]]
